name: Hämta priser

on:
  schedule:
    # 04:03 UTC varje dag – tidigt i Axfoods tillåtna besökstid 04:00–08:45 UTC, så en försenad start ändå hinner
    - cron: '3 4 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max antal sidor per kedja (tomt = alla)'
        required: false
        default: ''

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scraper/*.test.mjs

  lidl:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hämta Lidl
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node scraper/lidl.mjs

  scrape:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chain: [willys, hemkop]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hämta ${{ matrix.chain }}
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.max_pages }}" ]; then ARGS="--max-pages=${{ inputs.max_pages }}"; fi
          node scraper/axfood.mjs ${{ matrix.chain }} $ARGS
