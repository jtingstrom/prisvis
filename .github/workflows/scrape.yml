name: Hämta priser

on:
  schedule:
    # GitHub startar schemalagda körningar ofta flera timmar sent. Därför triggas
    # flödet varje timme; jobbet "gate" släpper bara igenom en körning per dag
    # inom Axfoods besökstid 04:00–08:45 UTC, resten avslutas direkt utan fel.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max antal sidor per kedja (tomt = alla)'
        required: false
        default: ''

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      axfood: ${{ steps.axfood.outputs.run }}
      lidl: ${{ steps.lidl.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: axfood
        run: node scraper/should-run.mjs willys hemkop
      - id: lidl
        run: node scraper/should-run.mjs lidl --any-time

  test:
    needs: gate
    if: needs.gate.outputs.axfood == 'true' || needs.gate.outputs.lidl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scraper/*.test.mjs

  lidl:
    needs: [gate, test]
    if: needs.gate.outputs.lidl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hämta Lidl
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node scraper/lidl.mjs

  scrape:
    needs: [gate, test]
    if: needs.gate.outputs.axfood == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chain: [willys, hemkop]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hämta ${{ matrix.chain }}
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.max_pages }}" ]; then ARGS="--max-pages=${{ inputs.max_pages }}"; fi
          node scraper/axfood.mjs ${{ matrix.chain }} $ARGS
