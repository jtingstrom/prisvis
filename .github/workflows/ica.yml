name: Hämta ICA-priser

on:
  schedule:
    # 21:37 UTC (22:37 svensk vintertid) – udda minut för att slippa GitHubs köer
    - cron: '37 21 * * *'
  workflow_dispatch:
    inputs:
      max_stores:
        description: 'Max antal butiker (tomt = alla som står på tur)'
        required: false
        default: ''

concurrency:
  group: scrape-ica
  cancel-in-progress: false

jobs:
  ica:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scraper/*.test.mjs
      - name: Hämta valda ICA-butiker
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          ARGS="--budget-min=300"
          if [ -n "${{ inputs.max_stores }}" ]; then ARGS="$ARGS --max-stores=${{ inputs.max_stores }}"; fi
          node scraper/ica.mjs $ARGS
