name: Hämta ICA-priser

on:
  schedule:
    # 22:30 UTC (23:30 svensk vintertid) – klart innan Axfood-körningen 04:10 UTC
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      max_stores:
        description: 'Max antal butiker (tomt = alla som står på tur)'
        required: false
        default: ''

concurrency:
  group: scrape-ica
  cancel-in-progress: false

jobs:
  ica:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scraper/*.test.mjs
      - name: Hämta valda ICA-butiker
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          ARGS="--budget-min=300"
          if [ -n "${{ inputs.max_stores }}" ]; then ARGS="$ARGS --max-stores=${{ inputs.max_stores }}"; fi
          node scraper/ica.mjs $ARGS
